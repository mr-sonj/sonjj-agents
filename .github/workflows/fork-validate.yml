# Checks the fork the way upstream's Validate checks main, plus the fork's own tests: every test file
# that the fork's commits add or change (found from the diff against main, so a new feature's tests
# are picked up without editing this file).
#
# Runs on pushes to mod, on pull requests and by hand. release.yml also calls it on the commit being
# released, and publishes only if it passes. Upstream's validate.yml is left unchanged.

name: Fork validate

on:
  push:
    branches:
      - mod
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upstream validation suite
        run: bun run validate:ci

      - name: Fork tests
        run: |
          base="$(git merge-base origin/main HEAD)"
          mapfile -t tests < <(git diff --name-only --diff-filter=AM "$base" HEAD -- '*.test.ts' '*.test.tsx')
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No test files added or changed since main."
            exit 0
          fi
          printf '%s\n' "${tests[@]}"
          # ./ makes bun treat each one as a path, not a name filter
          bun test "${tests[@]/#/./}"
