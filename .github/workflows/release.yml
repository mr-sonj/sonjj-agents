# Builds Sonjj Agents for every platform and publishes a GitHub release.
#
# Release: push a tag v<upstream version>-mod.<n> (for example v0.14.0-mod.1) on a commit of
# `mod`. The release notes are the matching "## <version>" section of CHANGELOG.md, or a short
# generated note when there is none.
# Dry run: start the workflow by hand on any branch. Everything is built and checked, and the
# files are kept as workflow artifacts for a few days instead of being published.
#
# The macOS build is signed with a Developer ID certificate and notarized when the repository has
# the secrets CSC_LINK (the .p12 file, base64), CSC_KEY_PASSWORD, APPLE_ID,
# APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID; without CSC_LINK it gets an ad-hoc signature.
# Windows and Linux builds are not signed. Branding (scripts/apply-branding.ts) is applied to the checkout before
# every build, as Craft's trademark policy asks of forks. Nothing is published unless the same
# commit passes fork-validate.yml (typecheck, upstream's tests, the fork's tests).

name: Release

on:
  push:
    tags:
      - "v*-mod.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.10"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: |
          upstream="$(jq -r .version package.json)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # The whole rest after "-mod." must be the counter: v0.14.0-mod.1oops or -mod.1-preview
            # would otherwise be published as a stable release.
            n="${GITHUB_REF_NAME#"v$upstream-mod."}"
            if [ "$n" = "$GITHUB_REF_NAME" ] || ! [[ "$n" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $upstream (expected v$upstream-mod.<n>, n = 1, 2, ...)"
              exit 1
            fi
            if ! git merge-base --is-ancestor HEAD origin/mod; then
              echo "::error::$GITHUB_REF_NAME is not on the mod branch"
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
          else
            version="$upstream-mod.dev"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Release notes
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MAC_SIGNED: ${{ secrets.CSC_LINK != '' }}
        run: |
          awk -v v="$VERSION" '
            /^## / { if (found) exit; found = ($2 == v); next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            upstream="${VERSION%-mod.*}"
            repo="https://github.com/$GITHUB_REPOSITORY"
            {
              echo "Built on [Craft Agents $upstream](https://github.com/craft-ai-agents/craft-agents-oss/releases/tag/v$upstream),"
              echo "with this fork's features ([FEATURES.md]($repo/blob/$GITHUB_REF_NAME/FEATURES.md))."
              echo ""
              if [ "$MAC_SIGNED" = "true" ]; then
                echo "The macOS build is signed and notarized. Windows and Linux builds are not signed;"
                echo "the [README]($repo#readme) explains how to open them."
              else
                echo "Builds are not signed; the [README]($repo#readme) explains how to open them."
              fi
            } > release-notes.md
          fi
          cat release-notes.md

      - name: Upload release notes
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 3

  validate:
    uses: ./.github/workflows/fork-validate.yml

  mac:
    needs: prepare
    # macos-15 (arm64), not macos-latest: the macos-26 pool behind macos-latest often has no free
    # runner and the job is cancelled after waiting ("not acquired by Runner").
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply branding
        run: bun run scripts/apply-branding.ts

      - name: Import the signing certificate
        # Not left to electron-builder: 26.4.0 passes the .p12 password to
        # `security set-key-partition-list -k`, which wants the keychain password, and the
        # macOS runner rejects it ("SecKeychainUnlock: ... passphrase ... not correct").
        # The build step signs from this keychain through CSC_KEYCHAIN.
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "CSC_LINK secret not set: the build gets an ad-hoc signature"
            exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          p12="$RUNNER_TEMP/signing.p12"
          kc_pass="$(openssl rand -base64 24)"
          echo "::add-mask::$kc_pass"
          base64 --decode <<<"$CSC_LINK" > "$p12"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          security import "$p12" -k "$kc" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$kc" > /dev/null
          # codesign looks up the intermediate certificate through the user search list
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc" | grep -q 'Developer ID Application:' \
            || { echo "::error::No Developer ID Application identity in CSC_LINK"; exit 1; }
          echo "CSC_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - name: Build DMG and zip (arm64)
        # Staging keeps electron-builder from scanning the whole workspace node_modules,
        # which can run out of memory on small runners.
        # With CSC_KEYCHAIN (set by the step above), electron-builder signs with the Developer ID
        # certificate in that keychain; the APPLE_* values turn on notarization (build-dmg.sh).
        # A missing secret is an empty value, which leaves that part off.
        env:
          CRAFT_DMG_STAGING: "1"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash apps/electron/scripts/build-dmg.sh arm64

      - name: Check the app bundle
        env:
          MAC_SIGNED: ${{ secrets.CSC_LINK != '' }}
        run: |
          app="$(find apps/electron/release -maxdepth 2 -name '*.app' -type d | head -1)"
          echo "App: $app"
          plist="$app/Contents/Info.plist"
          id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")"
          name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist")"
          echo "Bundle id: $id, name: $name"
          [ "$id" = "com.sonjj.agents" ] || { echo "::error::Unexpected bundle id $id"; exit 1; }
          [ "$name" = "Sonjj Agents" ] || { echo "::error::Unexpected app name $name"; exit 1; }
          if [ -e "$app/Contents/Resources/app-update.yml" ]; then
            echo "::error::app-update.yml present: the app would look for updates"
            exit 1
          fi
          [ -x "$app/Contents/Resources/app/resources/bin/darwin-arm64/uv" ] || { echo "::error::uv missing"; exit 1; }
          [ -f "$app/Contents/Resources/app/resources/pi-agent-server/index.js" ] || { echo "::error::pi-agent-server missing"; exit 1; }
          for dup in pi-agent-server bin/darwin-arm64; do
            [ ! -e "$app/Contents/Resources/app/dist/resources/$dup" ] || { echo "::error::$dup packaged twice (dist/resources)"; exit 1; }
          done
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | grep -E '^(Identifier|Signature|TeamIdentifier)'
          if [ "$MAC_SIGNED" = "true" ]; then
            # A certificate without notarization would still be blocked by Gatekeeper.
            info="$(codesign -dv --verbose=2 "$app" 2>&1)"
            grep -q '^Authority=Developer ID Application:' <<<"$info" \
              || { echo "::error::Not signed with a Developer ID Application certificate"; exit 1; }
            xcrun stapler validate "$app" || { echo "::error::No notarization ticket stapled"; exit 1; }
            assess="$(spctl --assess --type execute -vv "$app" 2>&1)" || true
            grep -q 'source=Notarized Developer ID' <<<"$assess" \
              || { echo "$assess"; echo "::error::Gatekeeper does not accept the app"; exit 1; }
            echo "Signed with Developer ID and notarized"
          else
            echo "::notice::CSC_LINK secret not set: the macOS build is not signed"
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: |
            apps/electron/release/*.dmg
            apps/electron/release/*.zip
          if-no-files-found: error
          retention-days: 3

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # apply-branding.ts matches LF line endings; Git for Windows checks out CRLF by default.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Windows paths once made branding skip files: a second run must find nothing left to change.
      - name: Apply branding
        shell: bash
        run: |
          bun run scripts/apply-branding.ts
          bun run scripts/apply-branding.ts --dry-run | tee "$RUNNER_TEMP/branding.txt"
          grep -q ': 0 files updated, 0 removed\.$' "$RUNNER_TEMP/branding.txt" || { echo "::error::Branding not fully applied"; exit 1; }

      - name: Build installer (x64)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps/electron/scripts/build-win.ps1

      - name: Check the installer
        shell: bash
        run: |
          ls apps/electron/release
          [ -f apps/electron/release/Sonjj-Agents-x64.exe ] || { echo "::error::Sonjj-Agents-x64.exe missing"; exit 1; }
          app=apps/electron/release/win-unpacked
          [ -f "$app/Sonjj Agents.exe" ] || { echo "::error::Sonjj Agents.exe missing"; exit 1; }
          if [ -e "$app/resources/app-update.yml" ]; then
            echo "::error::app-update.yml present: the app would look for updates"
            exit 1
          fi
          [ -f "$app/resources/app/resources/bin/win32-x64/uv.exe" ] || { echo "::error::uv missing"; exit 1; }
          [ -f "$app/resources/app/resources/pi-agent-server/index.js" ] || { echo "::error::pi-agent-server missing"; exit 1; }
          for dup in pi-agent-server bin/win32-x64; do
            [ ! -e "$app/resources/app/dist/resources/$dup" ] || { echo "::error::$dup packaged twice (dist/resources)"; exit 1; }
          done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: apps/electron/release/*.exe
          if-no-files-found: error
          retention-days: 3

  linux:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply branding
        run: bun run scripts/apply-branding.ts

      - name: Build AppImage (x64)
        run: bash apps/electron/scripts/build-linux.sh x64

      - name: Check the AppImage
        run: |
          ls apps/electron/release
          [ -f apps/electron/release/Sonjj-Agents-x64.AppImage ] || { echo "::error::Sonjj-Agents-x64.AppImage missing"; exit 1; }
          app=apps/electron/release/linux-unpacked
          if [ -e "$app/resources/app-update.yml" ]; then
            echo "::error::app-update.yml present: the app would look for updates"
            exit 1
          fi
          [ -x "$app/resources/app/resources/bin/linux-x64/uv" ] || { echo "::error::uv missing"; exit 1; }
          [ -f "$app/resources/app/resources/pi-agent-server/index.js" ] || { echo "::error::pi-agent-server missing"; exit 1; }
          for dup in pi-agent-server bin/linux-x64; do
            [ ! -e "$app/resources/app/dist/resources/$dup" ] || { echo "::error::$dup packaged twice (dist/resources)"; exit 1; }
          done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: apps/electron/release/*.AppImage
          if-no-files-found: error
          retention-days: 3

  server:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply branding
        run: bun run scripts/apply-branding.ts

      - name: Build server
        run: bun run scripts/build-server.ts --platform=${{ matrix.platform }} --arch=${{ matrix.arch }} --compress

      - name: Name the archive
        run: |
          mkdir -p out
          mv dist/craft-server-*-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz \
            "out/Sonjj-Agents-server-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"
          ls -l out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/*.tar.gz
          if-no-files-found: error
          retention-days: 3

  release:
    needs: [prepare, validate, mac, windows, linux, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: files
          pattern: "{mac,windows,linux,server}-*"
          merge-multiple: true

      - name: Checksums
        working-directory: files
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Keep the checksums (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: files/SHA256SUMS.txt
          retention-days: 3

      - name: Download release notes
        if: github.ref_type == 'tag'
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" files/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Sonjj Agents $VERSION" \
            --notes-file release-notes.md
